<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Flux Chat</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-body">

<div class="admin-auth" id="adminAuth">
  <div class="admin-auth__card">
    <h1>Espace admin — Flux</h1>
    <p>Entrez votre code administrateur.</p>
    <input type="password" id="adminCode" placeholder="Code admin" autocomplete="off" />
    <button id="adminEnter">Entrer</button>
    <div class="admin-auth__error" id="adminError"></div>
  </div>
</div>

<div class="admin-shell" id="adminShell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__head">
      <h1>Conversations</h1>
      <p id="adminCount">Chargement…</p>
    </div>
    <div class="admin-list" id="adminList"></div>
  </aside>
  <main class="admin-main" id="adminMain">
    <div class="admin-empty">Sélectionnez une conversation à gauche</div>
  </main>
</div>

<script src="assets/js/admin.js"></script>
</body>
</html>
